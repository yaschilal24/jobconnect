name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobconnect_test
          JWT_SECRET: ci_test_secret_at_least_32_chars_long_xxx
        run: |
          psql $DATABASE_URL -f src/database/schema.sql
          psql $DATABASE_URL -f src/database/schema-extra.sql
          npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm test